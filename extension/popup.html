<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      width: 280px;
      padding: 16px;
      background: #fafaf9;
      color: #1c1917;
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
    p { font-size: 12px; color: #78716c; margin: 0 0 14px; }
    label { font-size: 12px; font-weight: 500; display: block; margin-bottom: 4px; color: #57534e; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border: 1px solid #e7e5e4;
      border-radius: 7px;
      font-size: 12px;
      margin-bottom: 10px;
      background: white;
    }
    input:focus { outline: none; border-color: #f97316; }
    button {
      width: 100%;
      padding: 8px;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #ea6d0a; }
    .saved { color: #16a34a; font-size: 12px; margin-top: 8px; text-align: center; display: none; }
  </style>
</head>
<body>
  <h1>🍳 Meal Planner</h1>
  <p>Configure your app URL and secret to enable saving.</p>

  <label>App URL</label>
  <input type="text" id="mpUrl" placeholder="https://your-app.vercel.app" />

  <label>Extension Secret</label>
  <input type="password" id="mpSecret" placeholder="your_extension_secret" />

  <button id="save">Save settings</button>
  <div class="saved" id="saved">✓ Saved</div>

  <script src="popup.js"></script>
</body>
</html>
